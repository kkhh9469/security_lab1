name: security-lab1

topology:
  nodes:
    # ── Edge 라우터 ──────────────────────────
    edge1:
      kind: vyosnetworks_vyos
      image: vyos:2026.03-stream
      mgmt-ipv4: 172.20.20.10

    # ── Core 스위치 (Arista EOS) ─────────────
    core1:
      kind: ceos
      image: ceos:4.36.0F
      mgmt-ipv4: 172.20.20.20

    core2:
      kind: ceos
      image: ceos:4.36.0F
      mgmt-ipv4: 172.20.20.30

    # ── Access 스위치 (Arista EOS) ───────────
    access1:
      kind: ceos
      image: ceos:4.36.0F
      mgmt-ipv4: 172.20.20.40

    access2:
      kind: ceos
      image: ceos:4.36.0F
      mgmt-ipv4: 172.20.20.50

    access3:
      kind: ceos
      image: ceos:4.36.0F
      mgmt-ipv4: 172.20.20.60

    # ── Host 노드 (Alpine) ────────────────────
    host1:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.110.11/24 dev eth1
        - ip route add default via 192.168.110.1
        - ip link set eth1 up

    guest1:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.150.11/24 dev eth1
        - ip route add default via 192.168.150.1
        - ip link set eth1 up

    admin:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.120.11/24 dev eth1
        - ip route add default via 192.168.120.1
        - ip link set eth1 up

    monitoring:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.120.12/24 dev eth1
        - ip route add default via 192.168.120.1
        - ip link set eth1 up

    # ── Server 노드 (Alpine + httpd) ──────────
    nas:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.130.11/24 dev eth1
        - ip route add default via 192.168.130.1
        - ip link set eth1 up
        - mkdir -p /storage
        - sh -c "echo 'backup data' > /storage/file1.txt"

    www:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.140.11/24 dev eth1
        - ip route add default via 192.168.140.1
        - ip link set eth1 up
        - mkdir -p /www
        - sh -c "echo '<h1>Server-B</h1><p>VLAN30 - 192.168.140.11</p>' > /www/index.html"
        - httpd -p 80 -h /www
        - nc -lk -p 443 &

  links:
    # edge - core
    - endpoints: ["edge1:eth2", "core1:eth1"]
    - endpoints: ["edge1:eth3", "core2:eth1"]

    # core - core
    - endpoints: ["core1:eth2", "core2:eth2"]
    - endpoints: ["core1:eth3", "core2:eth3"]

    # core - access
    - endpoints: ["core1:eth4", "access1:eth1"]
    - endpoints: ["core1:eth5", "access2:eth1"]
    - endpoints: ["core1:eth6", "access3:eth1"]
    - endpoints: ["core2:eth4", "access1:eth2"]
    - endpoints: ["core2:eth5", "access2:eth2"]
    - endpoints: ["core2:eth6", "access3:eth2"]

    # access - endpoint
    - endpoints: ["access1:eth3", "host1:eth1"]
    - endpoints: ["access1:eth4", "guest1:eth1"]
    - endpoints: ["access2:eth3", "admin:eth1"]
    - endpoints: ["access2:eth4", "monitoring:eth1"]
    - endpoints: ["access3:eth3", "nas:eth1"]
    - endpoints: ["access3:eth4", "www:eth1"]
